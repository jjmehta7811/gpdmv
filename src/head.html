<title>GPDMV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700&family=Mukta+Vaani:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBF9F5;
  --surface:#FFFFFF;
  --surface-2:#F4F1EC;
  --line:#E3DFD7;
  --line-strong:#CFC9BE;
  --ink:#1C1B2B;
  --ink-2:#3D3B52;
  --muted:#6E6A7C;
  --indigo:#313B8F;
  --indigo-ink:#232A6B;
  --indigo-wash:#EDEEF9;
  --marigold:#C97E06;
  --marigold-wash:#FBF0D8;
  --madder:#AF3A2E;
  --madder-wash:#FAE9E6;
  --teal:#0E6B66;
  --teal-wash:#E2F1EF;
  --plum:#743A86;
  --plum-wash:#F3E9F6;
  --slate:#4C566B;
  --slate-wash:#EAEDF2;
  --rose:#A6386B;
  --rose-wash:#FAE7F0;
  --moss:#4C6B22;
  --moss-wash:#EDF3DF;
  --wa:#128C4A;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(28,27,43,.06),0 8px 24px -12px rgba(28,27,43,.18);
  --radius:14px;
  --display:"Baloo Bhai 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mukta Vaani",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141420;
    --surface:#1D1D2C;
    --surface-2:#25253688;
    --line:#313144;
    --line-strong:#454560;
    --ink:#ECE9F3;
    --ink-2:#C6C2D4;
    --muted:#9994A8;
    --indigo:#98A1EE;
    --indigo-ink:#B4BBF5;
    --indigo-wash:#242A55;
    --marigold:#EFB44A;
    --marigold-wash:#413213;
    --madder:#EE897C;
    --madder-wash:#43231F;
    --teal:#4FC0B7;
    --teal-wash:#12352F;
    --plum:#C48ED6;
    --plum-wash:#331E3B;
    --slate:#9FAEC6;
    --slate-wash:#24293A;
    --rose:#EE93BE;
    --rose-wash:#3D1C2B;
    --moss:#AECC72;
    --moss-wash:#26311A;
    --wa:#5BD07F;
    --on-accent:#141420;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#141420;
  --surface:#1D1D2C;
  --surface-2:#252536;
  --line:#313144;
  --line-strong:#454560;
  --ink:#ECE9F3;
  --ink-2:#C6C2D4;
  --muted:#9994A8;
  --indigo:#98A1EE;
  --indigo-ink:#B4BBF5;
  --indigo-wash:#242A55;
  --marigold:#EFB44A;
  --marigold-wash:#413213;
  --madder:#EE897C;
  --madder-wash:#43231F;
  --teal:#4FC0B7;
  --teal-wash:#12352F;
  --plum:#C48ED6;
  --plum-wash:#331E3B;
  --slate:#9FAEC6;
  --slate-wash:#24293A;
  --rose:#EE93BE;
  --rose-wash:#3D1C2B;
  --moss:#AECC72;
  --moss-wash:#26311A;
  --wa:#5BD07F;
  --on-accent:#141420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--indigo);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:14px 24px;padding-bottom:16px;margin-bottom:20px;
  border-bottom:2px solid var(--line-strong);
}
.brand{display:flex;align-items:flex-start;gap:14px}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-mark{
  width:58px;height:58px;flex:none;margin-top:1px;display:block;
  border-radius:12px;object-fit:cover;
  border:1px solid var(--line);background:var(--surface);
}
.kicker{
  margin:0;font-size:12.5px;letter-spacing:.06em;color:var(--marigold);
  font-weight:600;
}
h1{font-size:26px;letter-spacing:-.01em}
.byline{margin:0;font-size:13.5px;color:var(--muted)}
.join{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  padding:9px 15px;border-radius:999px;text-decoration:none;
  background:var(--surface);border:1.5px solid var(--wa);color:var(--wa);
  font-weight:600;font-size:14px;box-shadow:var(--shadow);
}
.join:hover{background:var(--wa);color:var(--on-accent);border-color:var(--wa)}
.join svg{flex:none}
.mast-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.save-btn{
  display:inline-flex;align-items:center;gap:8px;flex:none;cursor:pointer;
  padding:9px 15px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--indigo);color:var(--indigo);
  font:600 14px/1 var(--body);box-shadow:var(--shadow);
}
.save-btn:hover{background:var(--indigo);color:var(--on-accent)}
.save-btn svg{flex:none}

/* ---------- save sheet ---------- */
.save-sheet{max-width:560px}
.link-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.link-row input{
  flex:1 1 240px;min-width:0;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--surface-2);
  font:500 13.5px/1.3 var(--body);color:var(--ink-2);
}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tab{
  padding:8px 13px;border:0;background:none;cursor:pointer;
  font:600 14px/1 var(--body);color:var(--muted);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--indigo);border-bottom-color:var(--indigo)}
.how{padding:14px 2px 2px}
.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.how li b{font-weight:600}
.how .kb{
  display:inline-block;padding:1px 7px;border-radius:5px;
  border:1px solid var(--line-strong);background:var(--surface-2);
  font:600 12.5px/1.6 var(--body);
}
.how .tip{margin:12px 0 0;font-size:13.5px;color:var(--muted)}

.sub-btn{
  display:inline-flex;align-items:center;gap:8px;flex:none;cursor:pointer;
  padding:9px 15px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--marigold);color:var(--marigold);
  font:600 14px/1 var(--body);box-shadow:var(--shadow);
}
.sub-btn:hover{background:var(--marigold);color:var(--on-accent)}
.sub-btn svg{flex:none}
.sub-pick{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.sub-pick label{font:600 14px/1 var(--body);color:var(--ink-2)}
.sub-pick select{
  padding:10px 12px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--surface);
  font:500 15px/1.3 var(--body);color:var(--ink);
}
.sub-go{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub-go .btn{text-decoration:none;display:inline-flex;align-items:center}

/* ---------- jobs ---------- */
.jobs-panel{padding:20px 22px 22px}
.jobs-head h2{margin:0 0 4px;font:600 21px/1.2 var(--display);color:var(--ink)}
.jobs-sub{margin:0 0 16px;font-size:14.5px;color:var(--muted)}
.job-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.job{
  border:1px solid var(--line);border-left:4px solid var(--moss);
  border-radius:12px;padding:14px 16px;background:var(--surface);
}
.job.empty{border-left-color:var(--line-strong)}
.job-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.job-top h3{margin:0;font:600 17px/1.3 var(--body);color:var(--ink)}
.job-type{
  font:600 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.04em;
  color:var(--moss);background:var(--moss-wash);border-radius:999px;padding:5px 9px;
}
.job-meta{margin:4px 0 0;font-size:14px;color:var(--ink-2);font-weight:500}
.job-details{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.job-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.job-actions .btn{text-decoration:none;display:inline-flex;align-items:center}
.job-foot{margin:12px 0 0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .jobs-panel{padding:16px}
  .job{padding:13px 14px}
}

/* ---------- directory ---------- */
.dir-panel{padding:20px 22px 24px}
.dir-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 14px}
.dir-search{flex:1 1 260px;min-width:0}
.dir-search input{
  width:100%;box-sizing:border-box;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface);
  font:500 15px/1.3 var(--body);color:var(--ink);
}
.dir-sort{display:flex;flex-direction:column;gap:5px}
.dir-sort label{font:600 12.5px/1 var(--body);color:var(--muted)}
.dir-sort select{
  padding:11px 12px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface);
  font:500 14.5px/1.2 var(--body);color:var(--ink);
}
/* The trades stand in a column down the left at every width; on a phone the
   column narrows and each trade uses its short name so the businesses beside
   it keep a readable width. */
.dir-layout{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start}
.dir-chips{
  display:flex;flex-direction:column;gap:1px;margin:0;
  position:sticky;top:10px;
  border-right:1px solid var(--line);padding-right:8px;
}
.tchip{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  border:0;background:none;border-radius:8px;padding:7px 7px;cursor:pointer;
  font:500 12.5px/1.3 var(--body);color:var(--ink-2);
}
.tchip .n{margin-left:auto;color:var(--muted);font-weight:600;font-size:11.5px}
.tchip:hover{background:var(--surface-2);color:var(--ink)}
.tchip.on{background:var(--indigo-wash);color:var(--indigo);font-weight:600}
.tchip.on .n{color:var(--indigo);opacity:.8}
.tchip:first-child{margin-bottom:5px}
.t-full{display:none}
.t-short{display:inline}
.dir-count{margin:0 0 12px;font-size:13px;color:var(--muted)}
@media (min-width:860px){
  .dir-layout{grid-template-columns:232px minmax(0,1fr);gap:26px}
  .dir-chips{top:14px;padding-right:14px}
  .tchip{padding:8px 10px;font-size:13.5px;gap:8px}
  .tchip .n{font-size:12.5px}
  .tchip:first-child{margin-bottom:6px}
  .t-full{display:inline}
  .t-short{display:none}
}
.dir-empty{margin:18px 0;font-size:15px;color:var(--muted)}
.bz-group{margin:0 0 20px}
.bz-group h3{
  margin:0 0 8px;font:600 14px/1.25 var(--body);color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em;
}
.bz-group h3 span{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.bz-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bz{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.bz-head{
  position:relative;
  width:100%;display:flex;align-items:baseline;gap:10px;text-align:left;
  background:none;border:0;padding:12px 32px 12px 14px;cursor:pointer;font:inherit;
}
.bz-head:hover{background:var(--surface-2)}
.bz-name{font:600 15.5px/1.3 var(--body);color:var(--ink)}
.bz-type{font-size:13px;color:var(--muted);flex:1;min-width:0}
.bz-chev{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:var(--muted);transition:transform .15s;font-size:17px;
}
.bz-head[aria-expanded="true"] .bz-chev{transform:translateY(-50%) rotate(90deg)}
.bz-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.bz-person{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.bz-facts{display:flex;flex-direction:column;gap:2px;margin:10px 0 0}
.bz-fact{
  display:flex;gap:8px;font-size:14px;color:var(--ink-2);
  text-decoration:none;padding:3px 0;
}
a.bz-fact:hover{color:var(--indigo)}
.bz-fact b{flex:none;width:58px;font-weight:600;color:var(--muted);font-size:12.5px;padding-top:1px}
.bz-notes{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.bz-reviews{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.bz-reviews .btn{text-decoration:none;display:inline-flex;align-items:center;font-size:13.5px}
.req{font-size:11px;font-weight:600;color:var(--madder);text-transform:uppercase;letter-spacing:.04em}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tick{
  display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;
  font-size:14px;line-height:1.45;color:var(--ink-2);cursor:pointer;
}
.tick input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--indigo)}
.sub-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sub{border:1px solid var(--line);border-left:4px solid var(--marigold);border-radius:10px;padding:11px 13px;background:var(--surface)}
.sub-top{display:flex;align-items:baseline;gap:10px}
.sub-top b{font:600 15px/1.3 var(--body);color:var(--ink)}
.sub-top span{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.sub dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:9px 0 0;font-size:13.5px}
.sub dt{color:var(--muted);font-size:12px;font-weight:600}
.sub dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.sub-notes{margin:10px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.sub-acts{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 0}
.dir-filter{
  width:100%;box-sizing:border-box;margin:0 0 8px;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--surface);
  font:500 14px/1.2 var(--body);color:var(--ink);
}
@media (max-width:860px){
  .dir-panel{padding:16px 14px}
  .dir-sort{width:100%}
  .dir-sort select{width:100%}
  .bz-head{flex-wrap:wrap;gap:2px 8px;padding:11px 30px 11px 12px}
  .bz-name{font-size:14.5px;flex:1;min-width:0}
  .bz-type{flex-basis:100%;font-size:12.5px}
  .bz-body{padding:2px 12px 12px}
  .bz-fact{flex-wrap:wrap;gap:0 8px}
  .bz-fact b{width:auto;flex-basis:100%}
  .bz-group h3{font-size:12.5px}
}

/* ---------- section tabs ---------- */
.sitenav{
  display:flex;gap:4px;flex-wrap:wrap;
  margin:-8px 0 22px;padding:0 0 0 2px;
  border-bottom:1px solid var(--line);
}
.sitetab{
  display:inline-block;padding:10px 16px;
  font:600 15px/1 var(--body);color:var(--muted);text-decoration:none;
  border-bottom:3px solid transparent;margin-bottom:-1px;
  border-radius:8px 8px 0 0;
}
.sitetab:hover{color:var(--ink);background:var(--surface-2)}
.sitetab.is-on{color:var(--indigo);border-bottom-color:var(--indigo)}
.sitetab.is-off{color:var(--line-strong);pointer-events:none}

/* ---------- notice ---------- */
.notice{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  background:var(--marigold-wash);border:1px solid var(--marigold);
  border-radius:10px;padding:11px 14px;margin-bottom:20px;font-size:14px;
}
.notice p{margin:0;flex:1 1 240px;color:var(--ink-2)}
.notice strong{color:var(--ink)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.cal-head h2{flex:1;font-size:19px;text-align:center;font-variant-numeric:tabular-nums}
.nav-btn{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  font-size:18px;line-height:1;color:var(--ink-2);
}
.nav-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.today-btn{
  background:none;border:1px solid var(--line);border-radius:9px;
  padding:6px 11px;font-size:13px;font-weight:600;color:var(--indigo);
}
.today-btn:hover{background:var(--indigo-wash)}

.dow{
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:0 12px 6px;font-size:11.5px;font-weight:600;letter-spacing:.08em;
  color:var(--muted);text-align:center;
}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 12px}
.cell{
  position:relative;min-height:74px;padding:6px 4px 4px;
  background:none;border:1px solid transparent;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;
}
.cell:hover:not(.blank){background:var(--surface-2)}
.cell.blank{cursor:default;opacity:.35}
.cell .num{font-size:14px;font-weight:500;color:var(--ink-2);line-height:1.1}
.cell.today .num{
  background:var(--indigo);color:var(--on-accent);
  width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-weight:700;
}
.cell.has:not(.sel){border-color:var(--line)}
.cell.sel{background:var(--indigo-wash);border-color:var(--indigo)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--slate)}
.cell .tag{
  font-size:10.5px;font-weight:600;line-height:1.25;text-align:center;
  color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
@media (max-width:560px){.cell{min-height:54px}.cell .tag{display:none}}

.legend{
  display:flex;flex-wrap:wrap;gap:6px 14px;
  padding:12px 16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);
}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- day panel ---------- */
.day-panel{padding:16px}
@media (min-width:861px){.day-panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}}
.day-panel > h2{font-size:18px;margin-bottom:2px}
.day-sub{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.empty{
  margin:0;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;
  background:var(--surface-2);border-radius:10px;
}
.ev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ev{
  border:1px solid var(--line);border-radius:11px;overflow:hidden;
  border-left:4px solid var(--cat,var(--slate));background:var(--surface);
}
.ev-head{
  width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;
  background:none;border:0;padding:11px 13px;
}
.ev-head:hover{background:var(--surface-2)}
.ev-head .t{flex:1;min-width:0}
.ev-head h3{font-size:16px;font-family:var(--body);font-weight:600;line-height:1.3}
.ev-meta{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chev{flex:none;color:var(--muted);font-size:13px;transition:transform .18s ease;margin-top:3px}
.ev.open .chev{transform:rotate(90deg)}
.chip{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:2px 8px;border-radius:20px;
  background:var(--cat-wash,var(--slate-wash));color:var(--cat,var(--slate));
  white-space:nowrap;
}
